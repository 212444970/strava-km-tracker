<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Activity Tracker</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
<header>
  <h1>🚴 Activity Tracker</h1>
</header>

{% if not connected %}
<div class="connect-box">
  <h2>Nepropojeno</h2>
  <p>Vlastník ještě nepřipojil svůj Strava účet.</p>
</div>
{% else %}

<!-- Filter -->
<section class="filter-section">
  <div class="filter-btns" id="filter-btns"></div>
</section>

<!-- 1. Aktuální výkonnost -->
<div id="sec-current"></div>

<!-- 2. Grafy -->
<section class="chart-section">
  <div class="section-header">
    <h2>Měsíce <span id="chart-year-lbl"></span></h2>
    <div id="monthly-legend" class="monthly-legend"></div>
  </div>
  <div id="monthly-chart" class="bar-chart"></div>
</section>

<section class="chart-section">
  <h2>Rok po roku</h2>
  <div id="yearly-chart" class="bar-chart"></div>
</section>

<!-- 4. Insighty (2024+) + posledních 5 aktivit -->
<section class="chart-section">
  <h2>Rekordy & insighty <span class="dim">(od 2024)</span></h2>
  <div id="insights"></div>
</section>

<section class="rides-section">
  <h2>Posledních 5 aktivit</h2>
  <div id="rides-table"></div>
</section>

<section class="rides-section">
  <h2>Top 5 měsíců</h2>
  <div id="top-months"></div>
</section>

<section class="rides-section">
  <h2>Top 5 cest do práce <span class="dim">(nejrychlejší)</span></h2>
  <div id="top-commutes"></div>
</section>

<script>
const MONTHS = ['Led','Úno','Bře','Dub','Kvě','Čvn','Čvc','Srp','Zář','Říj','Lis','Pro'];
const CAT_LABELS = {{ category_labels | tojson }};
const ALL = {{ activities | tojson }};

let selCats = new Set();

// ── Column navigation state ────────────────────────────────────────────────
const _now0  = new Date();
let dispYear     = _now0.getFullYear();
let dispMonYear  = _now0.getFullYear();
let dispMon      = _now0.getMonth() + 1;
let dispWkOffset = 0;  // 0 = current week, 1 = last week, …
const _minYear   = Math.min(...ALL.map(a => +a.date.slice(0, 4)));

const availCats = (() => {
  const found = new Set(ALL.map(a => a.category));
  return ['road','mtb','virtual','ebike','ski','run','hike','swim','other'].filter(c => found.has(c));
})();

function active() {
  return selCats.size === 0 ? ALL : ALL.filter(a => selCats.has(a.category));
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDur(s) { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60); return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`; }
function r1(v) { return Math.round(v*10)/10; }
function pct(cur, ref) {
  if (!ref) return '';
  const p = Math.round((cur-ref)/ref*100);
  const cls = p>=0?'cmp-up':'cmp-dn', arr=p>=0?'↑':'↓', sign=p>=0?'+':'';
  return `<span class="${cls}">${arr} ${sign}${p}%</span>`;
}

// ── 1. Current performance ────────────────────────────────────────────────────

function computeCurrent(rides) {
  const now=new Date();
  const curY=now.getFullYear(), curM=now.getMonth()+1, curD=now.getDate();
  const isCurYear=dispYear===curY;
  const isMonCur=dispMonYear===curY&&dispMon===curM;
  // Week start for selected week (offset back by dispWkOffset weeks)
  const wday=now.getDay()===0?6:now.getDay()-1;
  const wkStart=new Date(curY,curM-1,curD-wday-dispWkOffset*7);
  const wkEnd=new Date(wkStart.getFullYear(),wkStart.getMonth(),wkStart.getDate()+7);
  const ytd={km:0,commute:0,dur:0,elev:0,cnt:0};
  const mon={km:0,commute:0,dur:0,elev:0,cnt:0};
  const wk= {km:0,commute:0,dur:0,elev:0,cnt:0};
  const isCommute=r=>{const n=r.name.toLowerCase();return (r.category==='road'||r.category==='mtb')&&(n.includes('do práce')||n.includes('domů'));};
  for (const r of rides) {
    const ry=+r.date.slice(0,4),rm=+r.date.slice(5,7),rd=+r.date.slice(8,10);
    const c=isCommute(r)?r.km:0;
    // Col 1: selected year — YTD (up to today's date) if current year, full year if past
    if (ry===dispYear&&(!isCurYear||rm<curM||(rm===curM&&rd<=curD)))
      {ytd.km+=r.km;ytd.commute+=c;ytd.dur+=r.moving_time;ytd.elev+=r.elevation;ytd.cnt++;}
    // Col 2: selected month
    if (ry===dispMonYear&&rm===dispMon)
      {mon.km+=r.km;mon.commute+=c;mon.dur+=r.moving_time;mon.elev+=r.elevation;mon.cnt++;}
    // Col 3: selected week
    const rDate=new Date(ry,rm-1,rd);
    if (rDate>=wkStart&&rDate<wkEnd)
      {wk.km+=r.km;wk.commute+=c;wk.dur+=r.moving_time;wk.elev+=r.elevation;wk.cnt++;}
  }
  const fmt=o=>({km:r1(o.km),commute:r1(o.commute),dur:Math.round(o.dur),elev:Math.round(o.elev),cnt:o.cnt});
  // Y and M are the REAL current values (needed by computeVs for same-day comparisons)
  return {ytd:fmt(ytd),mon:fmt(mon),wk:fmt(wk),Y:curY,M:curM,isCurYear,isMonCur,wkStart};
}

function renderCurrent(c, vs, rr) {
  const el=document.getElementById('sec-current');
  if (!el) return;
  const yrLbl=c.isCurYear?`YTD ${dispYear}`:String(dispYear);
  const monLbl=dispMonYear!==c.Y?`${MONTHS[dispMon-1]} ${dispMonYear}`:MONTHS[dispMon-1];
  const now=new Date();
  const todayWkStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-(now.getDay()===0?6:now.getDay()-1));
  const isCurWk=c.wkStart.getTime()===todayWkStart.getTime();
  const wkEnd=new Date(c.wkStart); wkEnd.setDate(wkEnd.getDate()+6);
  const fd2=d=>`${d.getDate()}.${d.getMonth()+1}.`;
  const wkLbl=isCurWk?'Tento týden':`${fd2(c.wkStart)}–${fd2(wkEnd)}`;
  const fk=v=>v>0?v+' km':'–';
  const fd=v=>v>0?fmtDur(v):'–';
  const fe=v=>v>0?(v/1000).toFixed(1)+' km↑':'–';
  const fc=v=>v>0?v:'–';
  // Build a cell: main value + optional comparison sub-lines
  function cell(val, lyPct, lyRef, avgPct, avgRef, accent) {
    const cmp=[];
    if (lyPct) cmp.push(`<span class="pt-cmp">${lyPct} <em>loni (${lyRef})</em></span>`);
    if (avgPct) cmp.push(`<span class="pt-cmp">${avgPct} <em>5y ø (${avgRef})</em></span>`);
    return `<div class="pt-val${accent?' pt-accent':''}"><span class="pt-num">${val}</span>${cmp.join('')}</div>`;
  }
  // Projection cell (only used in vzdálenost row)
  const projCell=`<div class="pt-val pt-proj"><span class="pt-num">${rr.projected>0?rr.projected+' km':'–'}</span>${rr.seasonal&&rr.linear!==rr.seasonal?`<span class="pt-cmp">lin. ${rr.linear} km</span>`:''}</div>`;
  const dash=`<div class="pt-val"><span class="pt-num">–</span></div>`;
  el.innerHTML=`
  <div class="perf-scroll"><div class="perf-table">
    <div class="pt-corner"></div>
    <div class="pt-head"><button class="pt-nav" id="yr-prev">‹</button>${yrLbl}<button class="pt-nav" id="yr-next"${dispYear>=c.Y?' disabled':''}>›</button></div>
    <div class="pt-head"><button class="pt-nav" id="mon-prev">‹</button>${monLbl}<button class="pt-nav" id="mon-next"${c.isMonCur?' disabled':''}>›</button></div>
    <div class="pt-head"><button class="pt-nav" id="wk-prev">‹</button>${wkLbl}<button class="pt-nav" id="wk-next"${dispWkOffset===0?' disabled':''}>›</button></div>
    <div class="pt-head">Projekce ${c.Y}</div>

    <div class="pt-label">Vzdálenost</div>
    ${cell(fk(c.ytd.km), pct(c.ytd.km,vs.ytd.ly.km), vs.ytd.ly.km+' km', pct(c.ytd.km,vs.ytd.avgKm), vs.ytd.avgKm+' km', true)}
    ${cell(fk(c.mon.km), pct(c.mon.km,vs.mon.ly.km), vs.mon.ly.km+' km', pct(c.mon.km,vs.mon.avgKm), vs.mon.avgKm+' km')}
    ${cell(fk(c.wk.km))}
    ${projCell}

    <div class="pt-label">Do práce</div>
    ${cell(fk(c.ytd.commute))}
    ${cell(fk(c.mon.commute))}
    ${cell(fk(c.wk.commute))}
    ${dash}

    <div class="pt-label">Čas</div>
    ${cell(fd(c.ytd.dur))}
    ${cell(fd(c.mon.dur))}
    ${cell(fd(c.wk.dur))}
    ${dash}

    <div class="pt-label">Výška</div>
    ${cell(fe(c.ytd.elev), pct(c.ytd.elev,vs.ytd.ly.elev), (vs.ytd.ly.elev/1000).toFixed(1)+' km↑', pct(c.ytd.elev,vs.ytd.avgElev), (vs.ytd.avgElev/1000).toFixed(1)+' km↑')}
    ${cell(fe(c.mon.elev), pct(c.mon.elev,vs.mon.ly.elev), (vs.mon.ly.elev/1000).toFixed(1)+' km↑', pct(c.mon.elev,vs.mon.avgElev), (vs.mon.avgElev/1000).toFixed(1)+' km↑')}
    ${cell(fe(c.wk.elev))}
    ${dash}

    <div class="pt-label">Aktivity</div>
    ${cell(fc(c.ytd.cnt), pct(c.ytd.cnt,vs.ytd.ly.cnt), vs.ytd.ly.cnt, pct(c.ytd.cnt,vs.ytd.avgCnt), vs.ytd.avgCnt)}
    ${cell(fc(c.mon.cnt), pct(c.mon.cnt,vs.mon.ly.cnt), vs.mon.ly.cnt, pct(c.mon.cnt,vs.mon.avgCnt), vs.mon.avgCnt)}
    ${cell(fc(c.wk.cnt))}
    ${dash}
  </div></div>`;
  document.getElementById('yr-prev').onclick=()=>{if(dispYear>_minYear){dispYear--;refresh();}};
  document.getElementById('yr-next').onclick=()=>{if(dispYear<c.Y){dispYear++;refresh();}};
  document.getElementById('mon-prev').onclick=()=>{
    if(dispMonYear>_minYear||dispMon>1){dispMon--;if(dispMon<1){dispMon=12;dispMonYear--;}refresh();}
  };
  document.getElementById('mon-next').onclick=()=>{
    if(!c.isMonCur){dispMon++;if(dispMon>12){dispMon=1;dispMonYear++;}refresh();}
  };
  document.getElementById('wk-prev').onclick=()=>{dispWkOffset++;refresh();};
  document.getElementById('wk-next').onclick=()=>{if(dispWkOffset>0){dispWkOffset--;refresh();}};
}

// ── 2. Comparisons (merged into table) ───────────────────────────────────────

function computeVs(rides) {
  const now=new Date(), cutM=now.getMonth()+1, cutD=now.getDate();
  function sumYTD(y) {
    let km=0,elev=0,cnt=0;
    for (const r of rides) {
      const ry=+r.date.slice(0,4),rm=+r.date.slice(5,7),rd=+r.date.slice(8,10);
      if (ry!==y) continue;
      if (rm<cutM||(rm===cutM&&rd<=cutD)) {km+=r.km;elev+=r.elevation;cnt++;}
    }
    return {km:r1(km),elev:Math.round(elev),cnt};
  }
  function sumMon(y,m) {
    let km=0,elev=0,cnt=0;
    for (const r of rides) {
      if (+r.date.slice(0,4)===y&&+r.date.slice(5,7)===m) {km+=r.km;elev+=r.elevation;cnt++;}
    }
    return {km:r1(km),elev:Math.round(elev),cnt};
  }
  const ytd5=[1,2,3,4,5].map(i=>sumYTD(dispYear-i));
  const mon5=[1,2,3,4,5].map(i=>sumMon(dispMonYear-i,dispMon));
  function avg5(arr,key){const v=arr.map(s=>s[key]).filter(v=>v>0);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0;}
  return {
    ytd:{ly:sumYTD(dispYear-1), avgKm:avg5(ytd5,'km'), avgElev:avg5(ytd5,'elev'), avgCnt:avg5(ytd5,'cnt')},
    mon:{ly:sumMon(dispMonYear-1,dispMon), avgKm:avg5(mon5,'km'), avgElev:avg5(mon5,'elev'), avgCnt:avg5(mon5,'cnt')},
  };
}

// ── Run rate (unchanged) ──────────────────────────────────────────────────────

function computeRunRate(rides) {
  const now=new Date(), curYear=String(now.getFullYear()), curMon=now.getMonth();
  const dayOfYear=Math.floor((now-new Date(now.getFullYear(),0,0))/86400000);
  const actualYr=rides.filter(r=>r.date.startsWith(curYear)).reduce((s,r)=>s+r.km,0);
  const linear=Math.round(actualYr/Math.max(dayOfYear,1)*365);
  const byYear={};
  for (const r of rides) {
    const y=r.date.slice(0,4); if (y>=curYear) continue;
    const m=+r.date.slice(5,7)-1;
    if (!byYear[y]) byYear[y]=Array(12).fill(0);
    byYear[y][m]+=r.km;
  }
  const past=Object.values(byYear).filter(ms=>ms.filter(v=>v>0).length>=6);
  if (!past.length) return {projected:linear,linear,seasonal:null,actualYr:Math.round(actualYr)};
  const pct=Array(12).fill(0);
  for (const y of past) { const t=y.reduce((a,b)=>a+b,0); if (!t) continue; for (let m=0;m<12;m++) pct[m]+=y[m]/t/past.length; }
  const donePct=pct.slice(0,curMon+1).reduce((a,b)=>a+b,0);
  const seasonal=donePct>0?Math.round(actualYr/donePct):linear;
  return {projected:seasonal,linear,seasonal,actualYr:Math.round(actualYr)};
}

// ── 3. Charts (unchanged) ─────────────────────────────────────────────────────

function computeMonthly(rides) {
  const now=new Date(), curYear=String(now.getFullYear()), curMon=now.getMonth();
  const byYear={};
  for (const r of rides) { const y=r.date.slice(0,4),m=+r.date.slice(5,7)-1; if(!byYear[y])byYear[y]=Array(12).fill(0); byYear[y][m]+=r.km; }
  const past=Object.entries(byYear).filter(([y])=>y<curYear).map(([,ms])=>ms);
  const curData=(byYear[curYear]||Array(12).fill(0)).map(v=>r1(v));
  const avg=Array(12).fill(0),max=Array(12).fill(0);
  if (past.length) { for (let m=0;m<12;m++) { const v=past.map(y=>y[m]); avg[m]=Math.round(v.reduce((a,b)=>a+b,0)/past.length); max[m]=Math.round(Math.max(...v)); } }
  return {curYear,curMon,curData,avg,max,hasPast:past.length>0};
}

function renderMonthly(d) {
  document.getElementById('chart-year-lbl').textContent=d.curYear;
  const legend=document.getElementById('monthly-legend');
  legend.innerHTML=d.hasPast?`<span class="leg-item"><span class="leg-avg"></span>průměr</span><span class="leg-item"><span class="leg-max"></span>max</span>`:'';
  const maxVal=Math.max(...d.curData,...d.avg,1);
  let html='';
  for (let m=0;m<12;m++) {
    const val=d.curData[m],avgV=d.avg[m],maxV=d.max[m],future=m>d.curMon;
    html+=`<div class="bar-row${future?' bar-future':''}">
      <span class="bar-label">${MONTHS[m]}</span>
      <div class="bar-wrap">
        <div class="bar-track"><div class="bar-fill${future?' bar-dim':''}" style="width:${val/maxVal*100}%"></div></div>
        ${d.hasPast&&avgV>0?`<div class="bar-avg-mk" style="left:${avgV/maxVal*100}%" title="Průměr: ${avgV} km"></div>`:''}
        ${d.hasPast&&maxV>0?`<div class="bar-max-mk" style="left:${maxV/maxVal*100}%" title="Max: ${maxV} km"></div>`:''}
      </div>
      <span class="bar-value">${val>0?val:`<span class="dim">–</span>`}${d.hasPast&&avgV>0?` <span class="dim">/ ${avgV}</span>`:''}</span>
    </div>`;
  }
  document.getElementById('monthly-chart').innerHTML=html;
}

function computeByYear(rides) {
  const byYear={};
  for (const r of rides) { const y=r.date.slice(0,4); if(!byYear[y])byYear[y]={km:0,elev:0,count:0}; byYear[y].km+=r.km;byYear[y].elev+=r.elevation;byYear[y].count++; }
  const rows=Object.entries(byYear).map(([y,d])=>({year:y,km:r1(d.km),elev:Math.round(d.elev),count:d.count})).sort((a,b)=>b.year.localeCompare(a.year));
  const maxKm=Math.max(...rows.map(r=>r.km),1);
  return rows.map(r=>({...r,pct:Math.round(r.km/maxKm*100)}));
}

function renderYearly(rows) {
  let html='';
  for (const r of rows) html+=`<div class="bar-row"><span class="bar-label">${r.year}</span><div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:${r.pct}%"></div></div></div><span class="bar-value">${r.km} km <span class="dim">(${r.count})</span></span></div>`;
  document.getElementById('yearly-chart').innerHTML=html||'<p class="empty">Žádná data.</p>';
}

// ── 4. Insights (2024+) ───────────────────────────────────────────────────────

function computeInsights(rides) {
  if (!rides.length) return null;
  const longest=rides.reduce((b,r)=>r.km>b.km?r:b,rides[0]);
  const topElev=rides.reduce((b,r)=>r.elevation>b.elevation?r:b,rides[0]);
  const byMonth={};
  for (const r of rides) { const ym=r.date.slice(0,7); byMonth[ym]=(byMonth[ym]||0)+r.km; }
  const [bestYM,bestMonKm]=Object.entries(byMonth).reduce((b,[k,v])=>v>b[1]?[k,v]:b,['',0]);
  const totalKm=rides.reduce((s,r)=>s+r.km,0);
  const totalElev=rides.reduce((s,r)=>s+r.elevation,0);
  return { longest, topElev, bestYM, bestMonKm:Math.round(bestMonKm),
           avgKm:r1(totalKm/rides.length), avgElev:Math.round(totalElev/rides.length),
           totalElev:Math.round(totalElev), everests:(totalElev/8849).toFixed(1),
           activeYears:new Set(rides.map(r=>r.date.slice(0,4))).size, count:rides.length };
}

function renderInsights(ins, allTimeKm, allTimeDur) {
  const el=document.getElementById('insights');
  if (!ins) { el.innerHTML='<p class="empty">Žádná data od 2024.</p>'; return; }
  const kmFmt=allTimeKm?Math.round(allTimeKm).toLocaleString('cs'):'–';
  const durFmt=allTimeDur?fmtDur(allTimeDur):'–';
  el.innerHTML=`<div class="insights-grid">
    <div class="insight-card"><span class="insight-lbl">Celkem km (vše)</span><span class="insight-val">${kmFmt} km</span><span class="insight-sub">od začátku záznamu</span></div>
    <div class="insight-card"><span class="insight-lbl">Celková doba (vše)</span><span class="insight-val">${durFmt}</span><span class="insight-sub">součet všech aktivit</span></div>
    <div class="insight-card"><span class="insight-lbl">Nejdelší aktivita</span><span class="insight-val">${ins.longest.km} km</span><span class="insight-sub">${esc(ins.longest.name)}<br>${ins.longest.date}</span></div>
    <div class="insight-card"><span class="insight-lbl">Průměr / aktivita</span><span class="insight-val">${ins.avgKm} km</span><span class="insight-sub">↑ ${ins.avgElev} m průměrně</span></div>
    <div class="insight-card"><span class="insight-lbl">Celková výška (2024+)</span><span class="insight-val">${(ins.totalElev/1000).toFixed(1)} km</span><span class="insight-sub">${ins.everests}× Everest</span></div>
    <div class="insight-card"><span class="insight-lbl">Největší převýšení</span><span class="insight-val">${ins.topElev.elevation} m</span><span class="insight-sub">${esc(ins.topElev.name)}<br>${ins.topElev.date}</span></div>
    <div class="insight-card"><span class="insight-lbl">Aktivit (2024+)</span><span class="insight-val">${ins.count}</span><span class="insight-sub">${ins.activeYears} aktivní rok(y)</span></div>
  </div>`;
}

function renderRides(rides) {
  const el=document.getElementById('rides-table');
  const recent=rides.slice(0,5);
  if (!recent.length) { el.innerHTML='<p class="empty">Žádné aktivity.</p>'; return; }
  let html=`<table><thead><tr><th>Datum</th><th>Název</th><th>Typ</th><th>Vzdálenost</th><th>Čas</th><th>Převýšení</th></tr></thead><tbody>`;
  for (const r of recent) {
    const isHist=r.source==='historical';
    html+=`<tr${isHist?' class="hist-row"':''}>
      <td class="date">${r.date.slice(0,7)}${isHist?' <span class="hist-badge">hist.</span>':''}</td>
      <td>${esc(r.name)}</td><td class="type">${esc(r.type)}</td>
      <td class="num">${r.km>0?r.km+' km':'–'}</td>
      <td class="num">${r.moving_time>0?fmtDur(r.moving_time):'–'}</td>
      <td class="num">${r.elevation>0?r.elevation+' m':'–'}</td>
    </tr>`;
  }
  el.innerHTML=html+'</tbody></table>';
}

// ── Top lists ─────────────────────────────────────────────────────────────────

function computeTopMonths(rides) {
  const byMonth={};
  for (const r of rides) { const ym=r.date.slice(0,7); byMonth[ym]=(byMonth[ym]||0)+r.km; }
  return Object.entries(byMonth).map(([ym,km])=>({ym,km:r1(km)})).sort((a,b)=>b.km-a.km).slice(0,5);
}

function renderTopMonths(rows) {
  const el=document.getElementById('top-months'); if (!el) return;
  if (!rows.length) { el.innerHTML='<p class="empty">Žádná data.</p>'; return; }
  let html=`<table><thead><tr><th>Měsíc</th><th>Rok</th><th class="num">Vzdálenost</th></tr></thead><tbody>`;
  for (const r of rows) { const [y,m]=r.ym.split('-'); html+=`<tr><td>${MONTHS[+m-1]}</td><td class="date">${y}</td><td class="num">${r.km} km</td></tr>`; }
  el.innerHTML=html+'</tbody></table>';
}

function computeTopCommutes(rides) {
  return rides
    .filter(r=>r.name.toLowerCase().includes('do práce')&&r.km>0&&r.moving_time>0)
    .map(r=>({...r,speed:Math.round(r.km/(r.moving_time/3600)*10)/10}))
    .sort((a,b)=>b.speed-a.speed)
    .slice(0,5);
}

function renderTopCommutes(rows) {
  const el=document.getElementById('top-commutes'); if (!el) return;
  if (!rows.length) { el.innerHTML='<p class="empty">Žádné cesty do práce.</p>'; return; }
  let html=`<table><thead><tr><th>Datum</th><th>Název</th><th class="num">Vzdálenost</th><th class="num">Čas</th><th class="num">Rychlost</th></tr></thead><tbody>`;
  for (const r of rows) { html+=`<tr><td class="date">${r.date}</td><td>${esc(r.name)}</td><td class="num">${r.km} km</td><td class="num">${fmtDur(r.moving_time)}</td><td class="num">${r.speed} km/h</td></tr>`; }
  el.innerHTML=html+'</tbody></table>';
}

// ── Filter ────────────────────────────────────────────────────────────────────

function initFilter() {
  // Default: road + mtb if available, otherwise all
  ['road','mtb'].filter(c=>availCats.includes(c)).forEach(c=>selCats.add(c));
  const container=document.getElementById('filter-btns');
  const mkBtn=(cat,label)=>{ const on=cat==='all'?selCats.size===0:selCats.has(cat); const b=document.createElement('button'); b.className='filter-btn'+(on?' active':''); b.dataset.cat=cat; b.textContent=label; container.appendChild(b); };
  mkBtn('all','Vše');
  for (const c of availCats) mkBtn(c,CAT_LABELS[c]||c);
  container.addEventListener('click',e=>{ const btn=e.target.closest('.filter-btn'); if(!btn) return;
    const cat=btn.dataset.cat;
    if (cat==='all') { selCats.clear(); container.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
    else { container.querySelector('[data-cat="all"]').classList.remove('active'); selCats.has(cat)?selCats.delete(cat):selCats.add(cat); btn.classList.toggle('active'); if(selCats.size===0) container.querySelector('[data-cat="all"]').classList.add('active'); }
    refresh();
  });
}

// ── Main ──────────────────────────────────────────────────────────────────────

function refresh() {
  const rides=active();
  const cur=computeCurrent(rides);
  const rr=computeRunRate(rides);
  const vs=computeVs(rides);

  renderCurrent(cur,vs,rr);
  renderMonthly(computeMonthly(rides));
  renderYearly(computeByYear(rides));

  const allTimeKm=rides.reduce((s,r)=>s+r.km,0);
  const allTimeDur=rides.reduce((s,r)=>s+r.moving_time,0);
  const rides2024=rides.filter(r=>r.date>='2024-01-01'&&r.source!=='historical');
  renderInsights(computeInsights(rides2024),allTimeKm,allTimeDur);
  renderRides(rides);
  renderTopMonths(computeTopMonths(rides));
  renderTopCommutes(computeTopCommutes(rides));
}

initFilter();
refresh();
</script>
{% endif %}
</body>
