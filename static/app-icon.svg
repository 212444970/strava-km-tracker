<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#FC4C02"/>

  <!-- Bicycle wheel (rear) -->
  <circle cx="160" cy="320" r="90" fill="none" stroke="white" stroke-width="18"/>
  <circle cx="160" cy="320" r="12" fill="white"/>
  <!-- Spokes rear -->
  <line x1="160" y1="230" x2="160" y2="308" stroke="white" stroke-width="7"/>
  <line x1="160" y1="332" x2="160" y2="410" stroke="white" stroke-width="7"/>
  <line x1="70"  y1="320" x2="148" y2="320" stroke="white" stroke-width="7"/>
  <line x1="172" y1="320" x2="250" y2="320" stroke="white" stroke-width="7"/>
  <line x1="96"  y1="256" x2="151" y2="311" stroke="white" stroke-width="7"/>
  <line x1="169" y1="329" x2="224" y2="384" stroke="white" stroke-width="7"/>
  <line x1="224" y1="256" x2="169" y2="311" stroke="white" stroke-width="7"/>
  <line x1="151" y1="329" x2="96"  y2="384" stroke="white" stroke-width="7"/>

  <!-- Bicycle wheel (front) -->
  <circle cx="352" cy="320" r="90" fill="none" stroke="white" stroke-width="18"/>
  <circle cx="352" cy="320" r="12" fill="white"/>
  <!-- Spokes front -->
  <line x1="352" y1="230" x2="352" y2="308" stroke="white" stroke-width="7"/>
  <line x1="352" y1="332" x2="352" y2="410" stroke="white" stroke-width="7"/>
  <line x1="262" y1="320" x2="340" y2="320" stroke="white" stroke-width="7"/>
  <line x1="364" y1="320" x2="442" y2="320" stroke="white" stroke-width="7"/>
  <line x1="288" y1="256" x2="343" y2="311" stroke="white" stroke-width="7"/>
  <line x1="361" y1="329" x2="416" y2="384" stroke="white" stroke-width="7"/>
  <line x1="416" y1="256" x2="361" y2="311" stroke="white" stroke-width="7"/>
  <line x1="343" y1="329" x2="288" y2="384" stroke="white" stroke-width="7"/>

  <!-- Frame -->
  <!-- Chain stay: rear hub to bottom bracket -->
  <line x1="160" y1="320" x2="256" y2="340" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <!-- Seat stay: rear hub to seat tube top -->
  <line x1="160" y1="320" x2="240" y2="210" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <!-- Seat tube: bb to seat -->
  <line x1="256" y1="340" x2="240" y2="210" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <!-- Top tube: seat to head -->
  <line x1="240" y1="210" x2="330" y2="210" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <!-- Down tube: head to bb -->
  <line x1="330" y1="210" x2="256" y2="340" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <!-- Fork: head to front hub -->
  <line x1="330" y1="210" x2="352" y2="320" stroke="white" stroke-width="14" stroke-linecap="round"/>

  <!-- Handlebar -->
  <line x1="315" y1="200" x2="355" y2="200" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <line x1="355" y1="200" x2="355" y2="180" stroke="white" stroke-width="12" stroke-linecap="round"/>

  <!-- Seat post + saddle -->
  <line x1="243" y1="210" x2="243" y2="185" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <line x1="220" y1="182" x2="268" y2="182" stroke="white" stroke-width="10" stroke-linecap="round"/>

  <!-- "KM" text at top -->
  <text x="256" y="110" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="72" fill="white" text-anchor="middle" letter-spacing="4">KM</text>
</svg>
